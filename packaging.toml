schema_version = 1
development_version = "0.0.1"
accepted = false
# The repository is published and its CD workflow may write to product
# Releases or R2 CDN, but only when manually dispatched with publish=true,
# approved by the `release` environment, and given the required secrets.
remote_changes_enabled = true
publish_enabled = true
automatic_publish = false
infrastructure_license = "MIT"
product_license = "GPL-3.0-or-later"

[cdn]
provider = "cloudflare-r2"
bucket = "komawm"
origin = "https://cdn.komawm.org"
release_prefix = "releases"
apt_prefix = "apt"
install_prefix = "install"

[archlinux]
status = "template-unaccepted"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
template = "archlinux/PKGBUILD.in"
jiku_template = "archlinux/PKGBUILD.jiku.in"
koma_bin_template = "archlinux/PKGBUILD.koma-bin.in"
jiku_bin_template = "archlinux/PKGBUILD.jiku-bin.in"
architectures = ["x86_64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]
jiku_packaged_binaries = ["jikud", "jiku"]

[nfpm]
koma_config = "nfpm/koma.yaml"
jiku_config = "nfpm/jiku.yaml"
formats = ["deb", "rpm", "apk"]
architectures = ["amd64", "arm64"]

[debian]
status = "template-unaccepted"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
templates = ["debian/changelog.in", "debian/control.in", "debian/rules.in"]
static_files = ["debian/copyright", "debian/source/format"]
architectures = ["amd64", "arm64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[rpm]
status = "template-unaccepted"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
template = "rpm/koma.spec.in"
architectures = ["x86_64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[alpine]
status = "template-unaccepted"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
template = "alpine/APKBUILD.in"
architectures = ["x86_64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[nix]
status = "template-unaccepted"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
templates = ["nix/koma.nix.in", "nix/flake.nix.in"]
upstream_flake_present = false
architectures = ["x86_64-linux", "aarch64-linux"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[freebsd]
status = "template-unaccepted-experimental"
runtime_verified = false
target_os = "FreeBSD 15+"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
templates = ["freebsd/Makefile.in", "freebsd/distinfo.in", "freebsd/pkg-manifest.ucl.in"]
static_files = ["freebsd/pkg-descr", "freebsd/pkg-plist"]
architectures = ["amd64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[openbsd]
status = "template-unaccepted-experimental"
runtime_verified = false
target_os = "OpenBSD 8+"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
templates = ["openbsd/Makefile.in", "openbsd/distinfo.in"]
static_files = ["openbsd/pkg/DESCR", "openbsd/pkg/PLIST"]
architectures = ["amd64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[homebrew]
status = "template-unaccepted"
platform_scope = "linux"
source_repository = "https://github.com/komawm/koma"
source_revision_required = "full-40-character-commit"
source_checksum_required = "sha256"
template = "homebrew/koma.rb.in"
koma_bin_template = "homebrew/koma-bin.rb.in"
jiku_bin_template = "homebrew/jiku-bin.rb.in"
architectures = ["x86_64", "aarch64"]
packaged_binaries = ["koma", "komactl", "koma-mcp", "koma-overview"]

[development_prerelease]
version = "0.0.1"
channel = "development"
accepted = false
publish_mode = "workflow_dispatch-with-release-environment"
workflow = ".github/workflows/cd-archlinux.yml"
multi_distro_workflow = ".github/workflows/cd-release.yml"
publish_input_default = false
environment = "release"
required_secret = "PRODUCT_RELEASE_TOKEN"
required_secret_permissions = "Contents: write on the target product repository only"
environment_secrets = [
  "CLOUDFLARE_ACCOUNT_ID",
  "CLOUDFLARE_API_TOKEN",
  "PRODUCT_RELEASE_TOKEN",
  "GH_PAT",
  "APT_GPG_PRIVATE_KEY",
  "AUR_SSH_PRIVATE_KEY",
  "COPR_CONFIG",
  "CACHIX_AUTH_TOKEN",
  "HOMEBREW_TAP_TOKEN",
]
products = ["koma", "jiku"]
release_assets = ["koma-<pkgver>-<pkgrel>-x86_64.pkg.tar.zst", "SHA256SUMS-archlinux", "PACKAGE-MANIFEST-archlinux.toml"]

[development_prerelease.matrix]
workflow = ".github/workflows/cd-release-matrix.yml"
channels = ["debian", "rpm", "alpine", "nix", "freebsd", "openbsd", "homebrew"]
publish_mode = "workflow_dispatch-with-release-environment"
publish_input_default = false
environment = "release"
required_secret = "PRODUCT_RELEASE_TOKEN"
optional_channel_secrets = ["AUR_SSH_PRIVATE_KEY", "APT_GPG_PRIVATE_KEY", "COPR_CONFIG", "HOMEBREW_TAP_TOKEN", "CACHIX_AUTH_TOKEN"]
release_assets = [
  "koma_<pkgver>-1_amd64.deb",
  "SHA256SUMS-debian-amd64",
  "PACKAGE-MANIFEST-debian-amd64.toml",
  "koma_<pkgver>-1_arm64.deb",
  "SHA256SUMS-debian-arm64",
  "PACKAGE-MANIFEST-debian-arm64.toml",
  "koma-<pkgver>-1.<dist>.x86_64.rpm",
  "koma-<pkgver>-1.<dist>.src.rpm",
  "SHA256SUMS-rpm-x86_64",
  "PACKAGE-MANIFEST-rpm-x86_64.toml",
  "koma-<pkgver>-1.<dist>.aarch64.rpm",
  "SHA256SUMS-rpm-aarch64",
  "PACKAGE-MANIFEST-rpm-aarch64.toml",
  "koma-<pkgver>-r0.x86_64.apk",
  "koma-doc-<pkgver>-r0.x86_64.apk",
  "SHA256SUMS-alpine-x86_64",
  "PACKAGE-MANIFEST-alpine-x86_64.toml",
  "koma-<pkgver>-r0.aarch64.apk",
  "koma-doc-<pkgver>-r0.aarch64.apk",
  "SHA256SUMS-alpine-aarch64",
  "PACKAGE-MANIFEST-alpine-aarch64.toml",
  "koma-<pkgver>.pkg",
  "SHA256SUMS-freebsd-amd64",
  "PACKAGE-MANIFEST-freebsd-amd64.toml",
  "koma-<pkgver>-openbsd-amd64.tar.gz",
  "SHA256SUMS-openbsd-amd64",
  "PACKAGE-MANIFEST-openbsd-amd64.toml",
  "koma.nix",
  "flake.nix",
  "SHA256SUMS-nix",
  "PACKAGE-MANIFEST-nix.toml",
  "koma.rb",
  "SHA256SUMS-homebrew",
  "PACKAGE-MANIFEST-homebrew.toml",
]

[jiku]
status = "incubation-prerelease-scaffold"

[release]
first_accepted_version = "0.1.0"
required_evidence = ["Green pinned product build", "Real source archive checksum", "License and source notices", "Isolated install and removal", "Upgrade and rollback", "Selected platform/backend matrix", "Independent review"]

[release.targets]
koma = "komawm/koma"
jiku = "komawm/jiku"

[platforms]
linux_architectures = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
macbook_linux_apple_silicon = { chips = ["M1", "M2", "M3", "M4"], target = "aarch64-unknown-linux-gnu", elf_max_page_size = 16384, kms_driver = "apple-dcp + mesa-asahi" }
macbook_linux_intel = { chips = ["Core i5", "Core i7", "Core i9"], target = "x86_64-unknown-linux-gnu", kms_driver = "i915 / amdgpu" }
bsd_experimental_targets = ["x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "x86_64-unknown-openbsd", "aarch64-unknown-openbsd"]
